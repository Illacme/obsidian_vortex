<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=docs/index.html">
    <title>正在进入发行指挥中心...</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 24px;
        }
        .title {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            opacity: 0.9;
        }
        .sub {
            font-size: 14px;
            color: #9ca3af;
            opacity: 0.8;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="title">正在加载出版成品...</div>
        <div class="sub">即将进入指挥中心</div>
    </div>
    <script>
        window.location.replace("docs/index.html");
    </script>
</body>
</html>
